name: Deploy NOEMA to GitHub Pages
on:
  workflow_run:
    workflows: ["Verify NOEMA"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: 确认受检提交仍为主分支最新版本
        id: current
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" = "${{ github.event.workflow_run.head_sha }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.ok == 'true'
      - name: 准备静态发布文件
        if: steps.current.outputs.ok == 'true'
        run: |
          mkdir -p dist
          cp index.html thumbnail-store.js thumbnail-worker.js library-index.js dist/
          cp -R assets src styles dist/
      - uses: actions/upload-pages-artifact@v3
        if: steps.current.outputs.ok == 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.ok == 'true'
        id: deployment
